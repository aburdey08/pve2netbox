# Combined mode: quick checks + full sync (recommended for >50 VMs).
# From repo root: edit values below, then:
#   docker compose -f contrib/docker/docker-compose.combined-mode.yml up -d

services:
  pve2netbox:
    image: aburdey/pve2netbox:1.2.0
    environment:
      # PVE API (required — replace with your values)
      - PVE_API_HOST=10.10.0.10
      - PVE_API_USER=netsync@pve
      - PVE_API_TOKEN=test-token
      - PVE_API_SECRET=your-secret-here
      # NetBox API (required — replace with your values)
      - NB_API_URL=https://netbox.example.org
      - NB_API_TOKEN=your-netbox-token-here
      # Target cluster (required): an existing ID, or NB_CLUSTER_NAME=... (created if missing)
      - NB_CLUSTER_ID=1
      # Optional
      - PVE_API_VERIFY_SSL=false
      - NB_API_DELAY_SECONDS=0.2
      - NB_API_RETRY_TOTAL=5
      - NB_API_RETRY_BACKOFF=1.0
      # Combined mode: quick check + full sync
      - QUICK_CHECK_INTERVAL_SECONDS=60
      - SYNC_INTERVAL_SECONDS=3600
      - SYNC_VMS=true
      - SYNC_LXC=true
      - SYNC_TAGS=true
      # IP addresses of LXC containers: auto (default) | runtime | config | none
      - LXC_IP_SOURCE=auto
      # Proxmox description (Notes) -> NetBox comments (or description)
      - SYNC_DESCRIPTION=true
      - DESCRIPTION_TARGET=comments
      # ostype -> Platform, pool -> Tenant (opt-in: often maintained by hand)
      - SYNC_PLATFORM=false
      - POOL_AS_TENANT=false
      # Templates: tag (mark with "pve-template") | skip | sync
      - TEMPLATE_POLICY=tag
      # Selecting what to sync (optional). Comma- or space-separated, case-insensitive.
      # Filtered guests are never deleted by ENABLE_CLEANUP — they still exist in Proxmox.
      # - SYNC_NODES=pve1,pve2
      # - EXCLUDE_NODES=pve-test
      # - SYNC_POOLS=prod,dmz
      # - INCLUDE_TAGS=netbox
      # - EXCLUDE_TAGS=no-netbox
      # - EXCLUDE_VMIDS=100,105,900-999
      # How much of NetBox is read before each sync: cluster (default) or all (pre-1.2.0 behaviour)
      - NB_PRELOAD_SCOPE=cluster
      - VM_ROLE=Virtual Machine
      - LXC_ROLE=LXC
      - DRY_RUN=false
      - ENABLE_CLEANUP=false
      - LOG_LEVEL=INFO
      - ENABLE_METRICS=false
      - METRICS_PORT=9090
      # Health endpoints /healthz and /readyz (used by the container healthcheck)
      - ENABLE_HEALTH_ENDPOINT=true
      # skip = log and continue when a Proxmox node has no device in NetBox; fail = exit
      - NODE_MISSING_POLICY=skip
    ports:
      - "9090:9090"
    restart: unless-stopped
